<style>
:scope{box-sizing:border-box;min-height:100vh;padding:var(--ds-space-3);background:var(--ds-color-paper);color:var(--ds-color-ink);font-family:var(--ds-font-body);overflow:hidden}
h2,p{margin:0;font-size:var(--ds-type-0);font-weight:400;line-height:1.5}
h2{font-size:var(--ds-type-1)}
.ink-x{width:var(--ds-space-6);height:var(--ds-radius-1);background:var(--ds-color-accent)}
.ink-y{width:var(--ds-radius-1);height:var(--ds-space-3);background:var(--ds-color-accent)}
.reveal{position:relative;height:var(--ds-space-4);margin-top:var(--ds-space-2)}
.cover{position:absolute;inset:0;background:var(--ds-color-surface);overflow:hidden}
.cover p{position:relative;color:var(--ds-color-surface);font-size:var(--ds-type-2)}
.cover img{position:absolute;inset:0;width:100%;height:100%}
[data-ds-enter]{animation:bad-entry 300ms ease-in-out both}
@keyframes bad-entry{from{width:var(--ds-space-2);transform:translateX(var(--ds-space-2))}to{width:var(--ds-space-3);transform:none}}
</style>
