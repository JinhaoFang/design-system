<!doctype html>
<!--
  Six fictional team logos for the evidence unit. Plain geometric marks plus wordmarks in one neutral gray on a transparent
  background, so any system can place them. Each .logo is rendered to assets/logos/<id>.png by render.ts.
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: "Noto Sans CJK SC", sans-serif; color: #4a4a4a; padding: 20px; }
  .logo { width: 360px; height: 120px; display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 20px; }
  .logo svg { width: 56px; height: 56px; flex: none; }
  .logo .word { font-size: 30px; font-weight: 700; letter-spacing: 0.04em; line-height: 1.1; }
  .logo .word small { display: block; font-size: 12px; font-weight: 500; letter-spacing: 0.22em; margin-top: 4px; }
  .latin .word { font-family: "Noto Sans CJK SC", sans-serif; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="logo" id="beichen">
  <svg viewBox="0 0 56 56" fill="none" stroke="#4a4a4a" stroke-width="4"><circle cx="28" cy="28" r="22"/><path d="M28 10 L34 28 L28 46 L22 28 Z" fill="#4a4a4a" stroke="none"/></svg>
  <div class="word">北辰实验室<small>BEICHEN LAB</small></div>
</div>
<div class="logo" id="yunling">
  <svg viewBox="0 0 56 56" fill="#4a4a4a"><path d="M4 48 L22 14 L32 32 L38 22 L52 48 Z"/></svg>
  <div class="word">云岭大学<small>图书馆</small></div>
</div>
<div class="logo latin" id="halden">
  <svg viewBox="0 0 56 56" fill="#4a4a4a"><rect x="6" y="6" width="18" height="44"/><rect x="32" y="6" width="18" height="20"/><rect x="32" y="32" width="18" height="18"/></svg>
  <div class="word">Halden Press</div>
</div>
<div class="logo" id="qinghe">
  <svg viewBox="0 0 56 56" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"><path d="M28 50 V12"/><path d="M28 24 C16 24 12 16 12 8"/><path d="M28 34 C40 34 44 26 44 18"/><path d="M28 44 C18 44 14 38 14 32"/></svg>
  <div class="word">青禾出版社</div>
</div>
<div class="logo latin" id="meridian">
  <svg viewBox="0 0 56 56" fill="none" stroke="#4a4a4a" stroke-width="4"><path d="M6 44 L28 8 L50 44 Z"/><path d="M6 44 H50" stroke-width="6"/></svg>
  <div class="word">Meridian Works</div>
</div>
<div class="logo" id="dukou">
  <svg viewBox="0 0 56 56" fill="none" stroke="#4a4a4a" stroke-width="4" stroke-linecap="round"><path d="M6 36 C16 28 24 44 34 36 C42 30 46 34 50 36"/><path d="M6 22 C16 14 24 30 34 22 C42 16 46 20 50 22"/></svg>
  <div class="word">渡口工作室</div>
</div>
</body>
</html>
