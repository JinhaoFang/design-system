<div class="cover-main"><div class="stack"><p class="part" data-ds-enter="rise" data-ds-step="slide" data-ds-ease="snap" data-ds-distance="2" data-ds-order="0">KRO-1600</p><h1 class="title" data-ds-enter="rise" data-ds-step="slide" data-ds-ease="snap" data-ds-distance="2" data-ds-order="0">新望远镜落成，山顶开放观测夜</h1><p class="lead" data-ds-enter="fade" data-ds-step="snap" data-ds-ease="fade" data-ds-distance="2" data-ds-order="1">鹞岭天文台建在海拔 2,860 米的山顶。口径 1.6 米的新望远镜落成后，每月两个周六的晚上向公众开放，每场 60 人。</p><p data-ds-enter="fade" data-ds-step="snap" data-ds-ease="fade" data-ds-distance="2" data-ds-order="2"><a class="key" href="#booking"><span>BOOK / 预约观测夜<small class="engraving">KRO-1600 / BOOKING</small></span></a></p></div>
