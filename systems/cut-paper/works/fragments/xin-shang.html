<style>
:scope { position:relative; box-sizing:border-box; isolation:isolate; padding:var(--ds-space-10) var(--ds-space-8); background:var(--ds-color-paper); color:var(--ds-color-ink); font-family:var(--ds-font-body); font-size:var(--ds-type-body); line-height:1.9; }
:scope * { box-sizing:border-box; }
h1,h2,h3,p,ul,ol,li,figure,blockquote,dl,dd,dt { margin:0; padding:0; font-weight:400; }
ul,ol { list-style:none; }
p,li,blockquote,figcaption { text-wrap:pretty; }
a { color:inherit; text-underline-offset:.3em; text-decoration-thickness:1px; }
a:focus-visible { outline:2px solid var(--ds-color-ink); outline-offset:var(--ds-space-1); }
.wrap { max-width:1200px; margin:0 auto; }
.t-head { font-size:var(--ds-type-head); line-height:1.45; text-wrap:balance; }
.t-sub { font-size:var(--ds-type-sub); line-height:1.6; text-wrap:balance; }
.lead { font-size:var(--ds-type-lead); line-height:2; max-width:26em; }
.note { font-size:var(--ds-type-note); color:var(--ds-color-ink-2); }
.num { font-family:var(--ds-font-num); font-variant-numeric:tabular-nums lining-nums; }
.stack { display:grid; gap:var(--ds-space-5); align-content:start; }
.letter { display:grid; gap:var(--ds-space-2); max-width:28em; font-size:var(--ds-type-lead); line-height:2.2; }
.s { position:relative; width:fit-content; max-width:100%; overflow:hidden; }
.veil { position:absolute; inset:0; background:var(--ds-color-paper-veil); }
.field { position:relative; }
.lf { position:absolute; display:block; aspect-ratio:120 / 124; }
.lf svg { display:block; width:100%; height:auto; overflow:visible; }
.btn { position:relative; display:inline-flex; align-items:center; min-height:calc(var(--ds-space-6) + var(--ds-space-3)); padding:0 var(--ds-space-6); border-radius:var(--ds-radius-pill); background:var(--ds-color-ink); color:var(--ds-color-paper); text-decoration:none; transition:transform var(--ds-duration-lift) var(--ds-easing-lift); }
.btn::after { content:""; position:absolute; inset:0; border-radius:inherit; box-shadow:var(--ds-shadow-lift); opacity:0; transition:opacity var(--ds-duration-lift) var(--ds-easing-lift); }

.btn:hover::after, .btn:focus-visible::after { opacity:1; }
.btn:focus-visible { outline:2px solid var(--ds-color-ink); outline-offset:3px; }
@media (max-width:860px) {
 :scope { padding:var(--ds-space-8) var(--ds-space-5); }

 .letter, .lead { font-size:var(--ds-type-body); }
}
@media (prefers-reduced-motion:reduce) { .btn, .btn::after { transition:none; } .btn:hover, .btn:focus-visible { transform:none; } }
.pair { display:grid; grid-template-columns:minmax(0,8fr) minmax(0,4fr); gap:var(--ds-space-8); align-items:stretch; }.pair .letter { max-width:36em; }.loose { min-height:100%; }[data-greeting] { margin-bottom:var(--ds-space-4); }
@media(max-width:860px){.pair{grid-template-columns:1fr;}.loose{min-height:0;aspect-ratio:2 / 1;}}</style><div class="wrap"><div class="pair" id="xin"><div class="letter" data-ds-stagger="sentence"><p class="s" data-greeting>致每一位种过树的人：<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="0" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p><p class="s">一百年前，栖桐还是城北的一片乱石坡。<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="1" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p><p class="s">第一批来种树的，是附近中学的十二个学生，和他们的植物课老师。<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="2" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p><p class="s">后来，来的人越来越多：退休的工人，带着孩子的父母，放了学的少年。<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="3" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p><p class="s">有人只来过一个春天，有人一来就是四十年。<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="4" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p><p class="s">有人认得三百种草，有人只会浇水。<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="5" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p><p class="s">有人一边挖坑一边讲他年轻时的事，有人一整天不说一句话。<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="6" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p><p class="s">你们没有一个人是一样的。<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="7" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p><p class="s">就像园子里的叶子：银杏是一把扇子，枫是一只手掌，蕨是一串细细的羽毛。<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="8" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p><p class="s">也正因为不一样，这里才长成了一座园子，而不是一片林场。<span class="veil" aria-hidden="true" data-ds-enter="peel-right" data-ds-order="9" data-ds-step="read" data-ds-ease="read" data-ds-wait="settle"></span></p></div><div class="field loose" role="img" aria-label="几片叶子从叶束上散开，一片接一片往下飘" data-ds-stagger="leaf"><span class="lf" style="left:30%;top:2%;width:17.6%" data-ds-enter="fall" data-ds-order="0" data-ds-step="drift" data-ds-ease="drift" data-ds-distance="8"><svg viewBox="-60 -112 120 124" aria-hidden="true" focusable="false"><g transform="rotate(11 0 -50)"><path d="M1.8 -0.1C2.7 -2.6 0 -9.6 3.3 -14.1C6.6 -18.6 14.5 -21.3 21.7 -27.3C28.9 -33.2 47.2 -47.4 46.6 -49.9C46 -52.4 20.1 -37 17.9 -42.3C15.7 -47.6 33.6 -78.2 33.3 -81.9C33 -85.6 21.9 -61 16.3 -64.4C10.6 -67.9 4.7 -102.7 -0.7 -102.6C-6.1 -102.5 -10.6 -67.2 -16.1 -63.8C-21.7 -60.4 -33.8 -85.8 -34 -82.1C-34.3 -78.5 -15.8 -47.3 -17.7 -41.8C-19.7 -36.4 -45.3 -52 -45.9 -49.6C-46.6 -47.2 -28.6 -33.2 -21.5 -27.4C-14.4 -21.5 -6.6 -19.2 -3.3 -14.5C-0.1 -9.8 -2.9 -1.6 -2 0.8C-1.2 3.2 0.9 2.3 1.8 -0.1Z" fill="var(--ds-color-mustard)" fill-rule="evenodd"/><path d="M0 -14 L0 -88 M0 -22 L34 -50 M0 -22 L-34 -50 M0 -26 L24 -74 M0 -26 L-24 -74" fill="none" stroke="var(--ds-color-paper)" stroke-width="1.4" stroke-linecap="round"/></g></svg></span><span class="lf" style="left:58%;top:10%;width:18.3%" data-ds-enter="fall" data-ds-order="1" data-ds-step="drift" data-ds-ease="drift" data-ds-distance="8"><svg viewBox="-60 -112 120 124" aria-hidden="true" focusable="false"><g transform="rotate(0.5 0 -50)"><path d="M1.8 -0.7C2.3 -4 0.8 -16.6 1.1 -20C1.5 -23.5 1.6 -22.7 3.7 -21.4C5.8 -20 9.4 -13.2 13.9 -12C18.3 -10.9 26.3 -12 30.5 -14.6C34.7 -17.1 37.6 -22.4 39.2 -27.5C40.9 -32.6 41.2 -38.9 40.3 -45.2C39.5 -51.5 37.3 -58.7 33.9 -65.5C30.4 -72.2 25.2 -80 19.6 -85.9C14 -91.7 6.9 -100.5 0.4 -100.6C-6.2 -100.7 -13.9 -92.4 -19.6 -86.5C-25.3 -80.7 -30.2 -72.2 -33.8 -65.4C-37.3 -58.6 -39.8 -52 -40.8 -45.8C-41.8 -39.5 -41.7 -33.2 -39.9 -27.9C-38.1 -22.5 -34.2 -16.2 -30 -13.6C-25.8 -11.1 -18.9 -11.2 -14.6 -12.5C-10.2 -13.9 -6
